; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Entorno original (ATmega4809, 8-bit AVR, lógica 5 V)
[env:nano_every]
platform = atmelmegaavr
board = nano_every
framework = arduino
upload_speed = 115200
monitor_speed = 115200

; Port a Arduino Nano 33 BLE (nRF52840, ARM Cortex-M4, core mbed, lógica 3.3 V)
; USB nativo: el "upload_speed" no aplica (bossac hace touch a 1200 bps).
[env:nano33ble]
platform = nordicnrf52
board = nano33ble
framework = arduino
monitor_speed = 115200
; El platform pide un toolchain ARM antiguo (<1.80000.0) que ya no está en el
; registro; se fuerza el único disponible/instalado (GCC ARM 14.2).
platform_packages =
    platformio/toolchain-gccarmnoneeabi@1.140201.0
