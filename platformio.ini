; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Entorno original (ATmega4809, 8-bit AVR, lógica 5 V)
[env:nano_every]
platform = atmelmegaavr
board = nano_every
framework = arduino
upload_speed = 115200
monitor_speed = 115200

; Port a Arduino Nano 33 BLE (nRF52840, ARM Cortex-M4, core mbed, lógica 3.3 V)
; USB nativo: el "upload_speed" no aplica (bossac hace touch a 1200 bps).
; NOTA: las versiones recientes del platform nordicnrf52 (10.x) generan un
; binario que sube "con éxito" pero NO arranca en el Nano 33 BLE (bug conocido:
; platform-nordicnrf52 issues #175/#184). Se fija 9.5.0, reportada como estable.
[env:nano33ble]
platform = nordicnrf52@9.5.0
board = nano33ble
framework = arduino
monitor_speed = 115200
; La libmbed.a precompilada del Nano 33 BLE se construyó con GCC 9.2.1. El
; registro de PlatformIO no tiene un GCC 9 para host aarch64, así que se usa el
; GCC 9.3.1 de xPack (linux-arm64) instalado localmente vía symlink, para que el
; ABI coincida con la libmbed y no cuelgue el arranque de mbed.
platform_packages =
    platformio/toolchain-gccarmnoneeabi @ symlink:///home/emmanuel/.platformio/packages/toolchain-gccarmnoneeabi-9
